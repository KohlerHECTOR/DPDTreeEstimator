[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdt"
dynamic = ["version"]
authors = [
  { name="Hector Kohler", email="hector.kohler@polytechnique.edu" },
]
description = "Dynamic Programming Decision Trees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/scikit-learn-contrib/project-template"
Issues = "https://github.com/scikit-learn-contrib/project-template/issues"

[project.optional-dependencies]
# Versions aligned with `.pre-commit-config.yaml`.
lint = ["black==23.3.0", "ruff==0.4.2", "pre-commit==3.7.1"]
test = ["pytest", "pytest-cov"]
dev = ["dpdt[lint,test]"]

[tool.setuptools]
# Explicit flat layout (a stale src/*.egg-info otherwise confuses discovery).
packages = ["dpdt", "dpdt.tests"]

[tool.setuptools_scm]
version_file = "dpdt/_version.py"

[tool.black]
line-length = 88
target_version = ['py310']
preview = true
exclude = '''
/(
    \.eggs         # exclude a few common directories in the
  | \.git          # root of the project
  | \.vscode
)/
'''
force-exclude = "dpdt/_version.py"

[tool.ruff]
# max line length for black
line-length = 88
target-version = "py310"
exclude=[
    ".git",
    "__pycache__",
    "dist",
    "build",
    "dpdt/_version.py",
]

[tool.ruff.lint]
# all rules can be found here: https://beta.ruff.rs/docs/rules/
select = ["E", "F", "W", "I"]
ignore=[
    # space before : (needed for how black formats slicing)
    "E203",
    # do not assign a lambda expression, use a def
    "E731",
    # do not use variables named 'l', 'O', or 'I'
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# It's fine not to put the import at the top of the file in the examples
# folder.
"examples/*"=["E402"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --color=yes"
doctest_optionflags = "NORMALIZE_WHITESPACE"
