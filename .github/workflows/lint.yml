name: Linter

on:
  push:
    branches:
    - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install -e ".[lint]"

      - name: Run linter
        run: |
          black --check --diff dpdt examples
          ruff check --output-format=full dpdt examples
